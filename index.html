function shelfSort(a, b) {
  const fa = a.finishedAt || '9999', fb = b.finishedAt || '9999';
  return fa < fb ? -1 : fa > fb ? 1 : (a.order - b.order);
}
function shelfGroups() {
  const done = BOOKS.filter(isDone).slice().sort(shelfSort);
  const map = new Map();
  const add = (key, title, b, sortKey) => { if (!map.has(key)) map.set(key, { key, title, books: [], sortKey }); map.get(key).books.push(b); };
  done.forEach(b => {
    if (SETTINGS.shelfGroup === 'category') { const l = getCategoryMeta(b.presetKey).label; add(b.presetKey, l, b, l); }
    else if (SETTINGS.shelfGroup === 'genre') { const g = (splitTag(b.tag).subtag.split(/[·,]/)[0] || '').trim(); add(g ? 'g:' + g.toLowerCase() : 'g:', g || 'Без жанра', b, g ? g : '￿'); }
    else { const ym = finishedYM(b); add(ym ? 'y' + ym.y : 'y-', ym ? 'Прочитано в ' + ym.y + ' году' : 'Без даты прочтения', b, ym ? -ym.y : 1e9); }
  });
  const arr = Array.from(map.values());
  if (SETTINGS.shelfGroup === 'year') arr.sort((a, b) => a.sortKey - b.sortKey);
  else arr.sort((a, b) => b.books.length - a.books.length || String(a.sortKey).localeCompare(String(b.sortKey), 'ru'));
  return arr;
}
function shelfBookHtml(b) {
  const src = COVER_URLS[String(b.id)];
  if (src) return '<button type="button" class="sb" data-act="open" data-id="' + esc(b.id) + '" title="' + esc(b.title) + '"><span class="sb-c"><img src="' + src + '" alt="' + esc(b.title) + '" loading="lazy"></span></button>';
  const h = hashStr(b.id + 'h'), pages = Number(b.pages) || 0;
  const height = 124 + h % 24;
  const width = pages ? Math.max(26, Math.min(46, 22 + pages / 25)) : 28 + (h >> 3) % 14;
  const c = SPINE_PAL[hashStr(b.id + '|' + b.title) % SPINE_PAL.length];
  return '<button type="button" class="sb" data-act="open" data-id="' + esc(b.id) + '" title="' + esc(b.title) + '"><span class="sb-s" style="--h:' + height + 'px;--w:' + Math.round(width) + 'px;--c:' + c[0] + ';--c2:' + c[1] + '"><i class="sb-em">' + MINI_FLOWER + '</i><span class="sb-t">' + esc(b.title) + '</span></span></button>';
}
function renderShelves() {
  const groups = shelfGroups();
  const total = groups.reduce((s, g) => s + g.books.length, 0);
  const withCover = BOOKS.filter(b => isDone(b) && COVER_URLS[String(b.id)]).length;
  let html = '<div class="seg" style="margin-bottom:14px">' + [['year', 'По годам'], ['category', 'По категориям'], ['genre', 'По жанрам']].map(o => '<button type="button" class="plain' + (SETTINGS.shelfGroup === o[0] ? ' active' : '') + '" data-act="shelf-group" data-v="' + o[0] + '">' + o[1] + '</button>').join('') + '</div>';
  if (!total) {
    html += emptyHtml('Полки ждут первых книг', 'Как только вы отметите книгу «Прочитано», она встанет здесь на полку — с вашей собственной обложкой.', '<a class="btn btn-primary" href="#/library">Открыть библиотеку</a>');
  } else {
    html += '<div class="shelf-sum"><span>' + total + ' ' + plural(total, BOOK_F) + ' на полках</span><span>' + groups.length + ' ' + plural(groups.length, ['полка', 'полки', 'полок']) + '</span><span>обложек: ' + withCover + '</span></div>';
    html += groups.map((g, i) => '<section class="bookcase"><div class="bc-head"><h2>' + esc(g.title) + '</h2><span class="pill">' + g.books.length + '</span></div><div class="bc-wall"><div class="bc-books">' +
      g.books.map(shelfBookHtml).join('') + '<span class="sb-decor">' + plantSVG(i) + '</span></div></div></section>').join('');
    if (withCover < total) html += '<p class="hint" style="text-align:center;margin-top:16px">Книги без загруженной обложки стоят корешком. Нажмите на книгу и добавьте своё фото обложки.</p>';
  }
  $('#shelvesContent').innerHTML = html;
}

let profileYear = CUR_YEAR;

function barChartSvg(values, labels, o) {
  o = o || {};
  const W = 320, H = 168, L = 24, R = 4, T = 16, B = 22, n = values.length;
  const goals = o.goals || [];
  const top = Math.max(4, ...values, ...goals);
  const step = top <= 6 ? 2 : top <= 12 ? 4 : top <= 30 ? 10 : 20;
  const max = Math.ceil(top / step) * step;
  const y = v => T + (H - T - B) * (1 - v / max);
  const slot = (W - L - R) / n, bw = Math.min(22, slot * 0.58);
  let g = '';
  for (let v = 0; v <= max; v += step) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="#F0E8E4" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="#A3978F">' + v + '</text>';
  values.forEach((v, i) => {
    const x = L + slot * i + (slot - bw) / 2, hl = o.highlight === i;
    const tip = (o.tips && o.tips[i]) || (labels[i] + ': ' + v);
    if (v > 0) {
      const h = Math.max(4, y(0) - y(v)), yy = y(0) - h, r = Math.min(4, bw / 2);
      g += '<path class="bar-r" d="M' + x + ' ' + y(0) + 'V' + (yy + r) + 'Q' + x + ' ' + yy + ' ' + (x + r) + ' ' + yy + 'H' + (x + bw - r) + 'Q' + (x + bw) + ' ' + yy + ' ' + (x + bw) + ' ' + (yy + r) + 'V' + y(0) + 'Z" fill="' + (hl ? '#B98BCB' : '#DCC6E8') + '"/>';
      g += '<text x="' + (x + bw / 2) + '" y="' + (yy - 4) + '" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6F6560">' + v + '</text>';
    }
    if (goals[i]) g += '<line x1="' + (x - 2) + '" x2="' + (x + bw + 2) + '" y1="' + y(goals[i]).toFixed(1) + '" y2="' + y(goals[i]).toFixed(1) + '" stroke="#D56989" stroke-width="2" stroke-linecap="round"/>';
    g += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9.5" fill="' + (hl ? '#3E3835' : '#A3978F') + '"' + (hl ? ' font-weight="600"' : '') + '>' + labels[i] + '</text>';
    g += '<rect x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + (H - T - B) + '" fill="transparent" data-tip="' + esc(tip) + '"/>';
  });
  return '<div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'График') + '">' + g + '</svg></div>';
}
function hbarsHtml(rows) {
  const max = Math.max(1, ...rows.map(r => r.v)), total = rows.reduce((s, r) => s + r.v, 0) || 1;
  return '<div class="hbars">' + rows.map((r, i) => '<div><div class="hb-top"><span>' + esc(r.l) + '</span><span><b>' + r.v + '</b> · ' + Math.round(r.v / total * 100) + '%</span></div><div class="bar ' + (i % 3 === 1 ? 'pink' : i % 3 === 2 ? 'lilac' : '') + '"><i style="width:' + Math.round(r.v / max * 100) + '%"></i></div></div>').join('') + '</div>';
}
function topGenres() {
  const pool = BOOKS.filter(b => isDone(b) || b.favorite);
  const cnt = {};
  pool.forEach(b => {
    const g = (splitTag(b.tag).subtag.split(/[·,]/)[0] || '').trim() || getCategoryMeta(b.presetKey).label;
    const w = 1 + (b.favorite ? 1 : 0) + (ratingOf(b) >= 9 ? 1 : 0);
    cnt[g] = (cnt[g] || 0) + w;
  });
  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 4);
}

  const byYear = {};

  const ys = Object.keys(byYear).map(Number);

    '<div class="kv"><span>Занято в браузере</span><b id="storageUse">…</b></div></div></div>';

    else $('#storageUse').textContent = 'нет данных';

(function () {

  document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY - 8); else tip.classList.remove('show'); });

   ========================================================================= */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function saveFileNow(blob, name) {
  if (isIOS && navigator.canShare && window.File) {
    try {
      const file = new File([blob], name, { type: blob.type });
      if (navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: name }).then(() => true).catch(e => { if (e && e.name === 'AbortError') return false; return downloadBlob(blob, name); });
      }
    } catch (e) {}
  }
  return Promise.resolve(downloadBlob(blob, name));
}
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  return true;
}
async function exportLibrary(withImages) {
  flushNote();
  const data = {
    app: 'Моя библиотека', format: 'pkc-library-export', version: 4, exportedAt: nowISO(),
    counts: { books: BOOKS.length, done: BOOKS.filter(isDone).length },
    storage: {}, covers: {}
  };
  data.storage[PKC_STORE_KEY] = BOOKS;
  data.storage[PKC_CATEGORIES_KEY] = CUSTOM_CATEGORIES;
  data.storage[PKC_GOALS_KEY] = GOALS;
  data.storage[PKC_SETTINGS_KEY] = SETTINGS;
  data.storage[PKC_ACH_KEY] = lsGet(PKC_ACH_KEY, {});
  if (withImages) {
    try { const all = await IDB.all(); for (const id in all) if (all[id] && all[id].data) data.covers[id] = all[id].data; }
    catch (e) { toast('Обложки прочитать не удалось — экспорт без них'); }
  }
  data.counts.covers = Object.keys(data.covers).length;
  const json = JSON.stringify(data);
  const blob = new Blob([json], { type: 'application/json' });
  const name = 'moya-biblioteka-' + todayISO() + (withImages ? '' : '-bez-oblozhek') + '.json';
  const s = openSheet({
    html: '<h3>Файл готов</h3><p class="sub">Книг: <b>' + data.counts.books + '</b> · обложек: <b>' + data.counts.covers + '</b> · размер ~' + fmtNum(blob.size / 1048576, 2) + ' МБ</p>' +
      '<p class="hint" style="margin:-6px 0 6px">' + (isIOS ? 'В открывшемся меню выберите «Сохранить в Файлы» — например, в iCloud Drive.' : 'Файл сохранится в папку загрузок.') + ' Храните копию вне браузера.</p>' +
      '<div class="btn-row"><button class="btn btn-ghost" type="button" data-close>Закрыть</button><button class="btn btn-primary" type="button" data-save>' + icon('download') + 'Сохранить файл</button></div>' +
      '<button class="btn btn-soft" type="button" data-copy style="width:100%;margin-top:10px">Скопировать как текст</button>' +
      '<div data-txtwrap style="display:none;margin-top:12px"><p class="hint" style="margin:0 0 6px">Если файл не скачивается — скопируйте этот текст и вставьте его в новой версии: «Профиль → Восстановить → Вставить текст».</p><textarea class="paste" readonly></textarea></div>'
  });
  $('[data-copy]', s.el).onclick = async () => {
    const light = withImages && json.length > 3e6 ? JSON.stringify(Object.assign({}, data, { covers: {} })) : json;
    const ta = $('.paste', s.el); ta.value = light; $('[data-txtwrap]', s.el).style.display = '';
    ta.focus(); ta.select();
    let ok = false;
    try { await navigator.clipboard.writeText(light); ok = true; } catch (e) { try { ok = document.execCommand('copy'); } catch (e2) {} }
    toast(ok ? 'Текст копии скопирован' + (light !== json ? ' (без обложек — слишком большой объём)' : '') : 'Выделите текст и скопируйте вручную');
    if (ok) { SETTINGS.lastExportAt = nowISO(); saveSettings(); }
  };
  $('[data-save]', s.el).onclick = () => {
    saveFileNow(blob, name).then(ok => { if (ok) { SETTINGS.lastExportAt = nowISO(); saveSettings(); s.close(); refresh(); toast('Резервная копия сохранена ✿'); } });
  };
}

const LEGACY_IMPORT_KEYS = ['books_v2', 'books_2026', 'books_ratings', 'books_comments', 'books_deleted', 'books_custom'];
function exportCSV() {
  flushNote();
  const head = ['ID', 'Название', 'Автор', 'Категория', 'Подкатегория', 'Статус', 'Оценка', 'Отзыв', 'Избранное', 'Дата прочтения', 'Прогресс %', 'Страниц', 'Год издания', 'Формат', 'Есть обложка'];
  const q = v => { const t = String(v == null ? '' : v); return /[";\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const rows = BOOKS.slice().sort(defaultOrderCompare).map(b => [b.id, b.title, b.author, getCategoryMeta(b.presetKey).label, splitTag(b.tag).subtag, STATUS_LABELS[statusOf(b)].label, ratingOf(b) || '', b.comment || '', b.favorite ? 'да' : '', b.finishedAt || '', statusOf(b) === 'reading' ? progOf(b) : '', b.pages || '', b.year || '', b.format ? FORMATS[b.format] : '', COVER_URLS[String(b.id)] ? 'да' : ''].map(q).join(';'));
  const blob = new Blob(['\ufeff' + [head.join(';')].concat(rows).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  saveFileNow(blob, 'moya-biblioteka-' + todayISO() + '.csv').then(ok => { if (ok) toast('Таблица сохранена'); });
}
function validateImport(obj) {
  if (Array.isArray(obj)) obj = { storage: { [PKC_STORE_KEY]: obj } };
  if (!obj || typeof obj !== 'object' || !obj.storage) throw new Error('Это не резервная копия библиотеки');
  const books = obj.storage[PKC_STORE_KEY];
  if (books === undefined || books === null) {
    const lr = obj.legacyRaw || {};
    if (LEGACY_IMPORT_KEYS.some(k => typeof lr[k] === 'string')) { obj._legacyOnly = true; return obj; }
    throw new Error('В копии нет списка книг');
  }
  if (!Array.isArray(books)) throw new Error('Список книг повреждён');
  books.forEach((b, i) => { if (!b || (typeof b.id !== 'string' && typeof b.id !== 'number') || typeof b.title !== 'string') throw new Error('Повреждена запись книги №' + (i + 1)); });
  const ids = new Set(books.map(b => String(b.id)));
  if (ids.size !== books.length) throw new Error('В копии повторяются ID книг');
  return obj;
}
function describeImport(obj) {
  if (obj._legacyOnly) return 'Данные старого формата (до версии 3) — приложение перенесёт их тем же механизмом миграции, что и раньше.';
  const books = obj.storage[PKC_STORE_KEY];
  const done = books.filter(b => b.status === 'done').length, withC = books.filter(b => b.comment).length;
  const cov = Object.keys(obj.covers || {}).length;
  return 'В копии: <b>' + books.length + '</b> ' + plural(books.length, BOOK_F) + ', прочитано <b>' + done + '</b>, с отзывами <b>' + withC + '</b>' + (cov ? ', обложек <b>' + cov + '</b>' : '') + (obj.exportedAt ? '<br>Создана: ' + fmtDateTime(obj.exportedAt) : '') + '.';
}
async function applyImport(obj) {
  const ok = await confirmSheet({
    title: 'Восстановить данные?', danger: false, ok: 'Восстановить',
    text: describeImport(obj) + '<br><br>Текущая библиотека (' + BOOKS.length + ' ' + plural(BOOKS.length, BOOK_F) + ') будет заменена, но сначала сохранится во внутреннюю резервную копию.'
  });
  if (!ok) return;
  if (!makeBackup(BACKUP_PREFIX + 'before_import_' + Date.now(), 'Перед восстановлением из копии', BOOKS.length)) {
    toast('Не удалось создать резервную копию — восстановление отменено', { timeout: 5000 }); return;
  }
  const covers = obj.covers || {};
  try {
    for (const id in covers) { if (typeof covers[id] === 'string' && covers[id].startsWith('data:image')) await IDB.put(id, { data: covers[id], updatedAt: nowISO() }); }
  } catch (e) { toast('Часть обложек не восстановлена: ' + e.message); }
  const st = obj.storage;
  try {
    if (obj._legacyOnly) {
      LEGACY_IMPORT_KEYS.forEach(k => { if (typeof obj.legacyRaw[k] === 'string') localStorage.setItem(k, obj.legacyRaw[k]); });
      if (st[PKC_CATEGORIES_KEY] !== undefined) lsSet(PKC_CATEGORIES_KEY, st[PKC_CATEGORIES_KEY]);
      localStorage.removeItem(PKC_MIGRATED_KEY); localStorage.removeItem(PKC_STORE_KEY); localStorage.removeItem(PKC_SCHEMA_KEY);
    } else {
      if (!lsSet(PKC_STORE_KEY, st[PKC_STORE_KEY])) return;
      [PKC_CATEGORIES_KEY, PKC_GOALS_KEY, PKC_SETTINGS_KEY, PKC_ACH_KEY].forEach(k => { if (st[k] !== undefined && st[k] !== null) lsSet(k, st[k]); });
      localStorage.setItem(PKC_MIGRATED_KEY, 'v3'); localStorage.removeItem(PKC_SCHEMA_KEY);
    }
  } catch (e) { toast('Ошибка восстановления: ' + e.message, { timeout: 5000 }); return; }
  location.hash = '#/library';
  location.reload();
}
function openImportSheet() {
  const s = openSheet({
    html: '<h3>Восстановить из копии</h3><p class="sub">Подойдёт файл экспорта этой версии или копия из файла «Перенос данных». Текущие данные сначала сохранятся в резервную копию.</p>' +
      '<div class="alist" style="margin-bottom:12px"><button class="aitem" type="button" data-file>' + icon('upload') + 'Выбрать файл (.json)</button></div>' +
      '<div class="flabel">или вставьте текст копии</div><textarea class="paste" placeholder="Вставьте сюда скопированный текст…"></textarea>' +
      '<div class="btn-row"><button class="btn btn-ghost" type="button" data-close>Отмена</button><button class="btn btn-primary" type="button" data-paste>Восстановить из текста</button></div>'
  });
  const run = (text) => {
    let obj;
    try { obj = validateImport(JSON.parse(String(text).trim())); }
    catch (e) { toast('Не удалось прочитать копию: ' + e.message, { timeout: 5000 }); return; }
    s.close(); applyImport(obj);
  };
  $('[data-file]', s.el).onclick = async () => { const f = await pickFile('jsonInput'); if (f) run(await f.text()); };
  $('[data-paste]', s.el).onclick = () => { const t = $('.paste', s.el).value; if (!t.trim()) { toast('Вставьте текст копии'); return; } run(t); };
}

function listBackups() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith(BACKUP_PREFIX) || k.startsWith('books_backup_before_migration_'))) out.push(k);
    }
  } catch (e) {}
  return out.map(k => {
    const raw = localStorage.getItem(k), v = safeParse(raw, null);
    if (k.startsWith('books_backup_before_migration_')) {
      const ts = +k.split('_').pop();
      return { key: k, legacy: true, title: 'Копия до первой миграции (старая версия)', date: isNaN(ts) ? '' : new Date(ts).toISOString(), raw };
    }
    return { key: k, legacy: false, title: (v && v.reason) || k, date: v && v.createdAt, count: v && v.count, raw, data: v };
  }).sort((a, b) => String(b.date).localeCompare(String(a.date)));
}
function openBackupsSheet() {
  const list = listBackups();
  const s = openSheet({
    html: '<h3>Резервные копии</h3><p class="sub">Хранятся в этом браузере. Приложение создаёт их автоматически каждый день и перед любым изменением структуры данных.</p>' +
      (list.length ? '<div class="bk-backups">' + list.map((b, i) => '<div class="bkp"><b>' + esc(b.title) + '</b><small>' + (b.date ? fmtDateTime(b.date) : '') + (b.count != null ? ' · ' + b.count + ' ' + plural(b.count, BOOK_F) : '') + '</small><div class="acts">' +
        (!b.legacy && b.data && b.data.storage && b.data.storage[PKC_STORE_KEY] ? '<button type="button" data-restore="' + i + '">Восстановить</button>' : '') + '<button type="button" data-dl="' + i + '">Скачать</button></div></div>').join('') + '</div>'
        : '<p class="hint">Копий пока нет.</p>') +
      '<div class="btn-row"><button class="btn btn-ghost" type="button" data-close>Закрыть</button></div>'
  });
  $$('[data-dl]', s.el).forEach(btn => btn.onclick = () => { const b = list[+btn.dataset.dl]; saveFileNow(new Blob([b.raw], { type: 'application/json' }), b.key + '.json'); });
  $$('[data-restore]', s.el).forEach(btn => btn.onclick = async () => {
    const b = list[+btn.dataset.restore];
    const ok = await confirmSheet({ title: 'Восстановить копию?', danger: false, ok: 'Восстановить', text: '«' + esc(b.title) + '» от ' + fmtDateTime(b.date) + '. Текущее состояние сначала сохранится в отдельную копию. Обложки не затрагиваются.' });
    if (!ok) return;
    if (!makeBackup(BACKUP_PREFIX + 'before_restore_' + Date.now(), 'Перед восстановлением копии', BOOKS.length)) { toast('Не удалось создать страховочную копию — отменено'); return; }
    const st = b.data.storage;
    try {
      Object.keys(st).forEach(k => localStorage.setItem(k, st[k]));
      localStorage.setItem(PKC_MIGRATED_KEY, 'v3'); localStorage.removeItem(PKC_SCHEMA_KEY);
    } catch (e) { toast('Ошибка восстановления: ' + e.message); return; }
    location.hash = '#/library'; location.reload();
  });
}

/* =========================================================================
   НАВИГАЦИЯ
   ========================================================================= */
const TABS = [
  { k: 'library', l: 'Библиотека', ic: 'book' },
  { k: 'goals', l: 'Цели', ic: 'target' },
  { k: 'shelves', l: 'Полки', ic: 'shelves' },
  { k: 'favorites', l: 'Избранное', ic: 'heart' },
  { k: 'profile', l: 'Профиль', ic: 'user' }
];
let route = { name: 'library' };
let lastTab = 'library';
let openedBookFromApp = false;
const SCROLL = {};

function parseHash() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const parts = h.split('/');
  if (parts[0] === 'book' && parts.length > 1) return { name: 'book', id: decodeURIComponent(parts.slice(1).join('/')) };
  if (TABS.some(t => t.k === parts[0])) return { name: parts[0] };
  return { name: 'library' };
}
function go(path) { const target = '#/' + path; if (location.hash === target) onRoute(); else location.hash = target; }
function renderTabbar() {
  const active = route.name === 'book' ? lastTab : route.name;
  $('#tabbarIn').innerHTML = TABS.map(t => '<a class="tab' + (t.k === active ? ' active' : '') + '" href="#/' + t.k + '" data-tab="' + t.k + '"' + (t.k === active ? ' aria-current="page"' : '') + '>' + icon(t.ic) + '<span>' + t.l + '</span></a>').join('');
}
function renderPage() {
  switch (route.name) {
    case 'book': renderBook(route.id); break;
    case 'goals': renderGoals(); break;
    case 'shelves': renderShelves(); break;
    case 'favorites': renderFavorites(); break;
    case 'profile': renderProfile(); break;
    default: renderLibrary();
  }
}
function refresh() { if (route.name === 'book' && document.activeElement && document.activeElement.id === 'noteArea') return; renderPage(); renderTabbar(); }
function onRoute() {
  flushNote();
  closeAllSheets();
  const prev = route;
  if (prev.name !== 'book') SCROLL[prev.name] = window.scrollY;
  route = parseHash();
  if (route.name !== 'book') lastTab = route.name;
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + route.name));
  renderPage(); renderTabbar();
  const y = route.name === 'book' ? 0 : (prev.name === 'book' ? (SCROLL[route.name] || 0) : 0);
  window.scrollTo(0, y);
}
window.addEventListener('hashchange', onRoute);

/* ---------- делегирование кликов ---------- */
const ACTIONS = {
  open: (id) => { openedBookFromApp = true; go('book/' + encodeURIComponent(id)); },
  more: (id) => openBookActions(id),
  add: () => openAddSheet(),
  filter: (_, el) => { filterStatus = el.dataset.v; renderChips(); renderLibList(); if (el.classList.contains('tile')) { const c = $('#statusChips'); c && c.scrollIntoView({ behavior: 'smooth', block: 'start' }); } },
  view: (_, el) => { SETTINGS.view = el.dataset.v; saveSettings(); renderChips(); renderLibList(); },
  back: () => { if (openedBookFromApp && history.length > 1) { openedBookFromApp = false; history.back(); } else go(lastTab); },
  share: (id) => { const b = findBook(id); if (b) shareBook(b); },
  fav: (id) => toggleFavorite(id),
  unfav: (id) => toggleFavorite(id),
  cover: (id) => openCoverSheet(id),
  edit: (id) => { flushNote(); openEditSheet(id); },
  delete: (id) => requestDelete(id),
  'set-status': (id, el) => { flushNote(); const b = findBook(id); setStatus(b, el.dataset.v); renderBook(id); },
  'dismiss-seed': () => { SETTINGS.seedNoticeDismissed = true; saveSettings(); renderLibNotices(); },
  'dismiss-hint': () => { SETTINGS.hintDismissed = true; saveSettings(); renderLibNotices(); },
  export: () => exportLibrary(true),
  'export-light': () => exportLibrary(false),
  'export-csv': () => exportCSV(),
  import: () => openImportSheet(),
  backups: () => openBackupsSheet(),
  cats: () => openCategoryManager(),
  gyear: (_, el) => { goalsYear = Math.min(CUR_YEAR + 1, goalsYear + (+el.dataset.d)); expandedMonth = null; renderGoals(); },
  pyear: (_, el) => { profileYear = Math.min(CUR_YEAR + 1, profileYear + (+el.dataset.d)); renderProfile(); },
  month: (_, el) => { const m = +el.dataset.m; expandedMonth = expandedMonth === m ? null : m; renderGoals(); },
  'set-ygoal': () => numberSheet({
    title: 'Цель на ' + goalsYear + ' год', sub: 'Сколько книг вы хотите прочитать?', value: yearGoal(goalsYear), max: 999,
    onSave: v => { setYearGoal(goalsYear, v); checkAchievements(); renderGoals(); toast(v ? 'Цель: ' + v + ' ' + plural(v, BOOK_F) + ' за ' + goalsYear : 'Цель убрана'); }
  }),
  'set-mgoal': (_, el) => { const m = +el.dataset.m; numberSheet({
    title: MONTHS[m - 1] + ' ' + goalsYear, sub: 'Цель на месяц — сколько книг прочитать', value: monthGoal(goalsYear, m), max: 99,
    onSave: v => { setMonthGoal(goalsYear, m, v); renderGoals(); }
  }); },
  distribute: async () => {
    const y = goalsYear, g = yearGoal(y); if (!g) return;
    const has = Array.from({ length: 12 }, (_, i) => monthGoal(y, i + 1)).some(Boolean);
    if (has && !(await confirmSheet({ title: 'Распределить цель?', danger: false, ok: 'Распределить', text: 'Текущие цели по месяцам будут заменены: ' + g + ' ' + plural(g, BOOK_F) + ' разделятся на 12 месяцев.' }))) return;
    const base = Math.floor(g / 12), rem = g % 12;
    for (let m = 1; m <= 12; m++) setMonthGoal(y, m, base + (m <= rem ? 1 : 0));
    renderGoals(); toast('Цели по месяцам заданы');
  },
  'focus-date': () => { const f = $('#finDate'); if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => { f.focus(); try { f.showPicker && f.showPicker(); } catch (e) {} }, 300); } },
  'shelf-group': (_, el) => { SETTINGS.shelfGroup = el.dataset.v; saveSettings(); renderShelves(); }
};
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab && tab.dataset.tab === route.name) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('.overlay')) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.id, el, e); }
});

/* ---------- статичные элементы ---------- */
$('#addBookBtn').innerHTML = icon('plus') + 'Добавить книгу';
$('#addBookBtn').addEventListener('click', openAddSheet);
$('#sortBtn').addEventListener('click', openSortSheet);
$('#searchInput').addEventListener('input', e => { searchQuery = e.target.value; renderLibList(); });
$$('[data-deco]').forEach(el => { el.innerHTML = (DECO[el.dataset.deco] || DECO.lily)(); });
hydrateIcons(document);
window.addEventListener('pagehide', flushNote);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushNote(); });

/* =========================================================================
   ЗАПУСК
   ========================================================================= */
checkAchievements(true);
if (!location.hash) history.replaceState(null, '', '#/library');
onRoute();
loadCovers();
</script>
